plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.motoobd.scanner'
    compileSdk 34

    defaultConfig {
        applicationId "com.motoobd.scanner"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "2.4.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
