name: Build Android 10 OBD-II APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android10-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK Platform 34
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Ensure WebView Asset Exists
        run: |
          mkdir -p app/src/main/assets
          if [ -f "web/obd2_diagnostic_app.html" ]; then
            cp web/obd2_diagnostic_app.html app/src/main/assets/index.html
          fi

      - name: Build Debug APK (v2.0.0 - Mobile Responsive & targetSdk 34)
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/motoobd-android10-debug.apk

      - name: Upload Android 10 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: motoobd-android10-debug-apk
          path: app/build/outputs/apk/debug/motoobd-android10-debug.apk
